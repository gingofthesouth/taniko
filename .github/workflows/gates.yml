name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Schemas and examples validate
        run: python3 schemas/validate.py

      - name: Conformance suite self-test
        run: python3 conformance/selftest.py

      - name: Routing-log grammar lint (production fixture)
        run: python3 conformance/loglint.py conformance/fixtures/finds-bug-run/routing.jsonl --evidence-dir conformance/fixtures/finds-bug-run

      # Anti-drift guard: no living doc may hardcode a version in a title.
      # Version truth lives in the schema $ids and the changelog; titles that
      # repeat it drift. docs/ is exempt — those are historical records.
      - name: No version numbers in doc titles
        run: |
          if grep -rEn --include='*.md' --exclude-dir=docs '^#{1,6} .*v[0-9]+\.[0-9]+\.[0-9]+' .; then
            echo "Doc title hardcodes a version — version truth lives in schema \$ids and the changelog."
            exit 1
          fi

      - name: Harness front door (repo conforms to its own contracts)
        run: python3 bin/harness verify

      - name: Installer smoke test (six modes, run-twice idempotent, exact file counts)
        run: |
          set -eu
          for tool in claude copilot codex opencode cursor all; do
            t="$(mktemp -d)"
            ./adoption/install-skills.sh --tool "$tool" --target "$t" > /dev/null
            ./adoption/install-skills.sh --tool "$tool" --target "$t" > /dev/null
            case "$tool" in
              claude)         probe="$t/.claude/skills/taniko-validate-run/SKILL.md"; expected=5 ;;
              copilot)        probe="$t/.github/skills/taniko-validate-run/SKILL.md"; expected=5 ;;
              codex|opencode) probe="$t/.agents/skills/taniko-validate-run.md";       expected=6 ;;
              cursor)         probe="$t/.cursor/rules/taniko-validate-run.mdc";       expected=5 ;;
              all)            probe="$t/.cursor/rules/taniko-validate-run.mdc";       expected=21 ;;
            esac
            test -f "$probe" || { echo "FAIL($tool): missing $probe"; exit 1; }
            case "$tool" in
              codex|opencode|all)
                [ "$(grep -c 'taniko-skills-start' "$t/AGENTS.md")" -eq 1 ] || { echo "FAIL($tool): AGENTS.md index duplicated or missing"; exit 1; } ;;
            esac
            found="$(find "$t" -type f | wc -l)"
            [ "$found" -eq "$expected" ] || { echo "FAIL($tool): expected $expected files, found $found"; exit 1; }
            rm -rf "$t"
          done
          echo "installer smoke test passed: 6 modes, idempotent, exact file counts"
